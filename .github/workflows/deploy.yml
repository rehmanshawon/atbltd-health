name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: base.Dockerfile
          target: frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/atbltd-health-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.atbltd.health/api

      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: base.Dockerfile
          target: backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/atbltd-health-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Log in to Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Pull latest images
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/atbltd-health-frontend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/atbltd-health-backend:latest

            # Restart containers with force recreate
            cd /home/ubuntu/apps/atbltd-health
            docker compose down
            docker compose up -d --force-recreate

            # Clean up
            docker image prune -f
