name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm run test:cov:backend

      - name: Run backend typecheck
        run: npm run typecheck:backend

      - name: Run backend lint
        run: npm run lint:backend

      - name: Security audit
        run: npm audit --workspace=@atbltd-health/backend --audit-level=high

  backend-e2e-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Start disposable test database
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Run backend e2e tests
        env:
          DB_HOST: localhost
          DB_PORT: "5433"
          DB_USERNAME: atbtest
          DB_PASSWORD: atbtest
          DB_DATABASE: atbltd_test
          JWT_SECRET: ci-e2e-test-secret
          TEST_MEMBER_PASSWORD: ci-e2e-member-password
        run: npm run test:e2e:backend

      - name: Tear down test database
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  backend-migration-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Start disposable migration database
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Apply migrations to empty database
        env:
          DB_HOST: localhost
          DB_PORT: "5433"
          DB_USERNAME: atbtest
          DB_PASSWORD: atbtest
          DB_DATABASE: atbltd_test
        run: npm run migration:run --workspace=@atbltd-health/backend

      - name: Tear down migration database
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci --include=optional

      - name: Run frontend tests
        run: npm run test:cov:frontend

      - name: Run frontend typecheck
        run: npm run typecheck:frontend

      - name: Run frontend lint
        run: npm run lint:frontend

      - name: Security audit
        run: npm audit --workspace=@atbltd-health/frontend --audit-level=high
