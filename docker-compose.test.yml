services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atbtest
      POSTGRES_PASSWORD: atbtest
      POSTGRES_DB: atbltd_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atbtest -d atbltd_test"]
      interval: 2s
      timeout: 5s
      retries: 15
