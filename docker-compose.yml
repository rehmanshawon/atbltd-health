version: "3.8"

services:
  frontend:
    image: ${DOCKERHUB_USERNAME}/atbltd-health-frontend:latest
    container_name: atbltd-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://13.232.183.239:3001/api
    depends_on:
      - backend
    networks:
      - atbltd-network
    restart: unless-stopped

  backend:
    image: ${DOCKERHUB_USERNAME}/atbltd-health-backend:latest
    container_name: atbltd-backend
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=atbuser
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=atbltd
      - JWT_SECRET=${JWT_SECRET}
      - GREENWEB_API_TOKEN=${GREENWEB_API_TOKEN}
      - GREENWEB_SENDER_ID=ATBLTD
    depends_on:
      db:
        condition: service_healthy
    networks:
      - atbltd-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: atbltd-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=atbuser
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=atbltd
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - atbltd-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atbuser -d atbltd"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  atbltd-network:
    driver: bridge

volumes:
  postgres-data:
